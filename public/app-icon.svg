<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="bolt-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="25" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Hexagon -->
  <path d="M 256 24 
           L 444 86 
           A 32 32 0 0 1 464 116 
           L 464 300 
           A 48 48 0 0 1 436 344 
           L 268 480 
           A 24 24 0 0 1 244 480 
           L 76 344 
           A 48 48 0 0 1 48 300 
           L 48 116 
           A 32 32 0 0 1 68 86 
           Z" 
        fill="url(#bg-grad)" 
        stroke="url(#ring-grad)" 
        stroke-width="12" 
        filter="url(#drop-shadow)" />

  <!-- Inner Circuit Traces -->
  <g stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" fill="none">
    <!-- Top Busbar Traces -->
    <line x1="160" y1="90" x2="160" y2="140" />
    <line x1="256" y1="65" x2="256" y2="130" />
    <line x1="352" y1="90" x2="352" y2="140" />

    <!-- Corner Circuit Lines -->
    <path d="M 90 160 L 140 160 L 170 190" />
    <path d="M 422 160 L 372 160 L 342 190" />
    <path d="M 90 280 L 140 280 L 180 320" />
    <path d="M 422 280 L 372 280 L 332 320" />

    <!-- Busbar Terminal Solder Pads -->
    <circle cx="160" cy="90" r="6" fill="#38bdf8" />
    <circle cx="256" cy="65" r="6" fill="#38bdf8" />
    <circle cx="352" cy="90" r="6" fill="#38bdf8" />
    <circle cx="90" cy="160" r="5" fill="#0284c7" />
    <circle cx="422" cy="160" r="5" fill="#0284c7" />
    <circle cx="90" cy="280" r="5" fill="#f59e0b" />
    <circle cx="422" cy="280" r="5" fill="#f59e0b" />
  </g>

  <!-- 3-Pole Industrial Contactor Representation Behind Bolt -->
  <g opacity="0.75">
    <!-- Stationary Contact Terminals (Top) -->
    <circle cx="180" cy="170" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" />
    <circle cx="256" cy="160" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" />
    <circle cx="332" cy="170" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" />

    <!-- Armature Link Bar -->
    <line x1="160" y1="210" x2="352" y2="210" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 8" />

    <!-- Moving Contacts (Connected / Engaged) -->
    <circle cx="180" cy="210" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="256" cy="210" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="332" cy="210" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Stationary Terminals (Bottom) -->
    <circle cx="180" cy="250" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3" />
    <circle cx="256" cy="260" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3" />
    <circle cx="332" cy="250" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3" />
  </g>

  <!-- High-Energy Glowing Lightning Bolt (Centerpiece) -->
  <polygon points="280,60 140,260 250,260 190,450 372,220 262,220"
           fill="url(#bolt-grad)"
           filter="url(#neon-glow)" />

  <!-- Lightning Bolt Inner Bright Core -->
  <polygon points="274,75 160,250 255,250 205,420 350,230 255,230"
           fill="url(#core-grad)"
           opacity="0.85" />

  <!-- Sparkling Electric Pulse Flares -->
  <circle cx="250" cy="260" r="9" fill="#ffffff" filter="url(#neon-glow)" />
  <circle cx="250" cy="260" r="4" fill="#ffffff" />
  <circle cx="270" cy="180" r="5" fill="#ffffff" filter="url(#neon-glow)" />
</svg>
